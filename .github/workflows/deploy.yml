name: Deploy Backend API
on:
push:
branches:
- main
jobs:
deploy:
runs-on: ubuntu-latest
steps:
- name: Desplegar Backend vía SSH
uses: appleboy/ssh-action@v1.0.3
with:
host: ${{ secrets.VPS_HOST }}
username: ${{ secrets.VPS_USERNAME }}
key: ${{ secrets.VPS_SSH_KEY }}
port: ${{ secrets.VPS_PORT }}
script: |
if [ ! -d "/var/www/sistemaescuelas-backend/.git" ]; then
git clone git@github.com:tu-usuario/tu-repo-backend.git /var/www/mi-app-backend
fi
cd /var/www/sistemaescuelas-backend
git pull origin main
npm ci --production
pm2 restart app-backend || pm2 start index.js --name "sistemaescuelas-backend"
pm2 save
