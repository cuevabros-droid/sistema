name: Deploy Backend API
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar Backend vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/sistemaescuelas-backend
            git checkout main
            git pull origin main
            npm install --production
            pm2 restart sistemaescuelas-backend || pm2 start index.js --name "sistemaescuelas-backend"
            pm2 save
