name: Deploy Backend API
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar Backend vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # 1. Si la carpeta no es un repositorio git, clona el proyecto
            if [ ! -d "/var/www/sistemaescuelas-backend/.git" ]; then
              git clone https://github.com/cuevabros-droid/sistemaescuelas-backend.git /var/www/sistemaescuelas-backend
            fi

            # 2. Entra a la carpeta y descarga los cambios
            cd /var/www/sistemaescuelas-backend
            git checkout main
            git pull origin main

            # 3. Instala dependencias
            npm install --production

            # 4. Inicia o reinicia el proceso en PM2
            pm2 restart sistemaescuelas-backend || pm2 start index.js --name "sistemaescuelas-backend"
            pm2 save
